<!DOCTYPE html>
<html lang="en">
    <!--Including head.html-->
    <!--@see: https://litenode.pages.dev/docs/rendering-templates/#include-->
    {{#include("partials/head.html")}}

    <body>
        <!--Including header.html-->
        {{#include("partials/header.html")}}

        <!--Including main.html-->
        {{#include("partials/main.html")}}

        <!--Including footer.html-->
        {{#include("partials/footer.html")}}

        <!--Loading Default Theme Scripts Using Absolute Path-->
        <!--@see: https://litenode.pages.dev/docs/serving-static-files/-->
        <script src="/content/themes/default/assets/js/main.js"></script>

        <!-- Video facade runtime (点击加载视频；静态导出时同样有效) -->
        <script src="/assets/video-facade.js" defer></script>
        <!-- Share bar runtime (复制链接 / 微信二维码弹层 / 打印) -->
        <script src="/assets/share-bar.js" defer></script>

        <!-- Admin bar -->
        {{aetherBar}}
